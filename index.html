<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>寶可夢肉鴿大冒險 - 永久存檔保護版</title>
    <style>
        * {
            box-sizing: border-box;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: #111;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; font-family: sans-serif; color: white;
        }
        #gameContainer {
            position: relative; width: 100vw; height: 100vh;
            display: flex; justify-content: center; align-items: center;
        }
        canvas {
            border: 2px solid #555; background-color: #1b2631; display: block;
            max-width: 100%; max-height: 100%; object-fit: contain;
        }
        #pauseBtn {
            display: none;
            position: absolute;
            top: 15px;
            left: 15px;
            width: 40px;
            height: 40px;
            background-color: rgba(0, 0, 0, 0.6);
            border: 2px solid #FFD700;
            color: #FFD700;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            z-index: 5;
            text-align: center;
            line-height: 36px;
        }
        .uiOverlay {
            display: none; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.95);
            border: 3px solid #FFD700; padding: 20px; text-align: center;
            border-radius: 12px; box-shadow: 0 0 25px rgba(255, 215, 0, 0.5);
            z-index: 10; width: 90%; max-width: 400px; max-height: 90vh; overflow-y: auto;
        }
        .optionBtn {
            display: block; width: 100%; margin: 8px auto; padding: 10px;
            background-color: #333; color: white; border: 2px solid #666;
            border-radius: 6px; font-size: 14px; cursor: pointer; transition: 0.2s;
        }
        .optionBtn:hover { background-color: #555; border-color: #FFD700; }
        .upgradeRow {
            display: flex; justify-content: space-between; align-items: center;
            margin: 8px 0; background: #222; padding: 8px 12px;
            border-radius: 8px; border: 1px solid #444; font-size: 13px;
        }
        .upgradeBtn {
            padding: 6px 10px; background-color: #27ae60; color: white;
            border: none; border-radius: 5px; cursor: pointer; font-weight: bold;
        }
        .charCard {
            display: flex; align-items: center; justify-content: space-between;
            background: #222; border: 2px solid #444; border-radius: 8px;
            padding: 8px; margin: 8px 0;
        }
        .charCard.selected { border-color: #FFD700; background: #332b00; }
    </style>
</head>
<body>

    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <div id="pauseBtn" onclick="togglePause()">⏸</div>

        <!-- 1. 主選單 (Start Menu) -->
        <div id="mainMenu" class="uiOverlay" style="display: block;">
            <h2 style="color: #FFD700; margin-top: 0;">⚡ 寶可夢肉鴿大冒險</h2>
            <p style="color: #aaa; font-size: 12px;">🛡️ 永久存檔安全保護 • 數據永不遺失</p>
            <p style="color: #FFD700; font-size: 16px;">💰 當前金幣: <span id="menuGoldDisplay">0</span></p>
            <button class="optionBtn" style="background-color: #1e8449; border-color: #2ecc71;" onclick="startGame()">▶ 開始遊戲 (Start)</button>
            <button class="optionBtn" onclick="openCharSelect()">🐾 選擇角色 (Characters)</button>
            <button class="optionBtn" onclick="openUpgradeShop()">🛠 屬性強化 (Upgrade)</button>
        </div>

        <!-- 2. 角色選擇 -->
        <div id="charSelect" class="uiOverlay">
            <h3 style="color: #FFD700; margin-top: 0;">🐾 選擇寶可夢</h3>
            <p style="color: #FFD700; font-size: 14px;">💰 金幣: <span id="charGoldDisplay">0</span></p>
            <div id="charListContainer"></div>
            <button class="optionBtn" style="margin-top: 15px;" onclick="closeCharSelect()">🔙 返回主選單</button>
        </div>

        <!-- 3. 局外強化商店 -->
        <div id="upgradeShop" class="uiOverlay">
            <h3 style="color: #FFD700; margin-top: 0;">🛠 局外屬性強化</h3>
            <p style="color: #FFD700; font-size: 14px;">💰 金幣: <span id="shopGoldDisplay">0</span></p>
            
            <div class="upgradeRow">
                <div>💥 全招式威力 (+15%)</div>
                <button class="upgradeBtn" onclick="buyUpgrade('dmg')">升級 (<span id="dmgCost">50</span>💰)</button>
            </div>
            <div class="upgradeRow">
                <div>❤️ 生命上限 (+20)</div>
                <button class="upgradeBtn" onclick="buyUpgrade('hp')">升級 (<span id="hpCost">50</span>💰)</button>
            </div>
            <div class="upgradeRow">
                <div>⚡ 基礎移速 (+0.5)</div>
                <button class="upgradeBtn" onclick="buyUpgrade('speed')">升級 (<span id="speedCost">50</span>💰)</button>
            </div>
            <div class="upgradeRow">
                <div>🧲 拾取磁力 (+25)</div>
                <button class="upgradeBtn" onclick="buyUpgrade('magnet')">升級 (<span id="magnetCost">50</span>💰)</button>
            </div>

            <button class="optionBtn" style="margin-top: 15px;" onclick="closeUpgradeShop()">🔙 返回主選單</button>
        </div>

        <!-- 4. 局內升級選單 -->
        <div id="levelUpMenu" class="uiOverlay">
            <h3 style="color: #FFD700; margin-top: 0;">🎉 招式學習 / 屬性提升</h3>
            <p style="font-size: 12px; color: #aaa;">選擇一個能力強化你的隊伍：</p>
            <div id="upgradeOptionsContainer"></div>
        </div>

        <!-- 5. 遊戲暫停選單 (Pause Menu) -->
        <div id="pauseMenu" class="uiOverlay">
            <h3 style="color: #FFD700; margin-top: 0;">⏸ 遊戲暫停</h3>
            <p style="font-size: 13px; color: #aaa;">目前當局獲得金幣: <span id="pauseGoldText">0</span> 💰</p>
            <button class="optionBtn" style="background-color: #1e8449; border-color: #2ecc71;" onclick="togglePause()">▶ 繼續遊戲</button>
            <button class="optionBtn" style="border-color: #FF4444;" onclick="exitGameFromPause()">🏠 退出遊戲 (保存金幣)</button>
        </div>

        <!-- 6. Game Over 結算畫面 -->
        <div id="gameOverMenu" class="uiOverlay" style="border-color: #FF4444;">
            <h3 style="color: #FF4444; margin-top: 0;">💀 遊戲結束</h3>
            <p id="finalScoreText" style="font-size: 13px;">你達到了等級 1！</p>
            <p style="color: #FFD700; font-size: 15px;">本次獲得金幣: +<span id="earnedGoldText">0</span> 💰</p>
            <button class="optionBtn" style="border-color: #FF4444;" onclick="returnToMainMenu()">🏠 返回主選單</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const mainMenu = document.getElementById('mainMenu');
        const upgradeShop = document.getElementById('upgradeShop');
        const charSelect = document.getElementById('charSelect');
        const levelUpMenu = document.getElementById('levelUpMenu');
        const pauseMenu = document.getElementById('pauseMenu');
        const gameOverMenu = document.getElementById('gameOverMenu');
        const pauseBtn = document.getElementById('pauseBtn');
        const finalScoreText = document.getElementById('finalScoreText');
        const earnedGoldText = document.getElementById('earnedGoldText');
        const pauseGoldText = document.getElementById('pauseGoldText');
        const upgradeOptionsContainer = document.getElementById('upgradeOptionsContainer');
        const charListContainer = document.getElementById('charListContainer');

        const WORLD_WIDTH = 3200;
        const WORLD_HEIGHT = 3200;

        let gameState = 'MENU';

        const TYPE_CHART = {
            electric: { water: 2.0, grass: 0.5, electric: 0.5 },
            fire: { grass: 2.0, water: 0.5, fire: 0.5 },
            grass: { water: 2.0, fire: 0.5, grass: 0.5 },
            water: { fire: 2.0, grass: 0.5, water: 0.5 }
        };

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let bgmTimer = null;

        function startBGM() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            if (bgmTimer) clearInterval(bgmTimer);

            const notes = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25];
            let step = 0;

            bgmTimer = setInterval(() => {
                if (gameState !== 'PLAYING') return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(notes[step % notes.length], audioCtx.currentTime);
                gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.18);
                step++;
            }, 200);
        }

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);

            if (type === 'shoot') {
                osc.frequency.setValueAtTime(450, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                osc.start(); osc.stop(audioCtx.currentTime + 0.08);
            } else if (type === 'hit') {
                osc.type = 'square'; osc.frequency.setValueAtTime(120, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                osc.start(); osc.stop(audioCtx.currentTime + 0.05);
            } else if (type === 'gem') {
                osc.frequency.setValueAtTime(700, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1400, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                osc.start(); osc.stop(audioCtx.currentTime + 0.08);
            } else if (type === 'heal') {
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            } else if (type === 'levelup') {
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.setValueAtTime(600, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                osc.start(); osc.stop(audioCtx.currentTime + 0.25);
            }
        }

        const CHARACTERS = {
            eevee: { name: '伊布', id: 133, price: 0, desc: '均衡型，經驗拾取範圍較大', bonusMag: 30, bonusSpeed: 0 },
            pikachu: { name: '皮卡丘', id: 25, price: 100, desc: '高速度，移動與基礎攻速較快', bonusMag: 0, bonusSpeed: 0.6 },
            charmander: { name: '小火龍', id: 4, price: 200, desc: '高爆發，初始火系威力提升', bonusMag: 0, bonusSpeed: 0 }
        };

        // 預設標準資料結構
        const defaultSaveData = {
            gold: 0, selectedChar: 'eevee', unlockedChars: ['eevee'],
            dmgLevel: 0, hpLevel: 0, speedLevel: 0, magnetLevel: 0,
            baseHp: 100, baseSpeed: 2.2, baseMagnet: 90, dmgMultiplier: 1.0
        };

        // 安全讀取與防覆蓋修復機制（Safe Load & Deep Merge）
        function loadGameData() {
            try {
                const raw = localStorage.getItem('pokesurvivor_perfect_save');
                if (!raw) return { ...defaultSaveData };
                const parsed = JSON.parse(raw);
                // 自動補齊新更新欄位，完美合併舊進度
                return Object.assign({}, defaultSaveData, parsed);
            } catch (e) {
                console.error("存檔讀取異常，改用預設值", e);
                return { ...defaultSaveData };
            }
        }

        let savedData = loadGameData();

        function saveGame() { 
            try {
                localStorage.setItem('pokesurvivor_perfect_save', JSON.stringify(savedData)); 
            } catch (e) {
                console.error("存檔寫入失敗", e);
            }
        }

        function resizeCanvas() {
            if (window.innerWidth < window.innerHeight) { canvas.width = 450; canvas.height = 800; }
            else { canvas.width = 1000; canvas.height = 650; }
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const images = { ball: new Image(), shinyBall: new Image(), boss: new Image() };
        images.ball.src = 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png';
        images.shinyBall.src = 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/ultra-ball.png';
        images.boss.src = 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/6.png';

        const pokemonCache = {};
        function getPokemonImg(id, isShiny = false) {
            const key = `${id}_${isShiny}`;
            if (!pokemonCache[key]) {
                pokemonCache[key] = new Image();
                pokemonCache[key].src = isShiny 
                    ? `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/shiny/${id}.png`
                    : `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png`;
            }
            return pokemonCache[key];
        }

        let player = {};
        let sessionGold = 0;
        let gameTimeFrames = 0;
        const camera = { x: 0, y: 0 };
        let bullets = [];
        let enemies = [];
        let gems = [];
        let particles = [];
        let chests = [];
        let damageTexts = [];
        let rocks = [];

        let screenShakeTime = 0;
        let currentWeather = 'NORMAL';
        let weatherTimer = 0;

        let joystick = { active: false, startX: 0, startY: 0, moveX: 0, moveY: 0 };
        const keys = {};
        
        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (e.key === 'Escape' || e.key === 'Esc') {
                if (gameState === 'PLAYING' || gameState === 'PAUSED') {
                    togglePause();
                }
            }
        });
        window.addEventListener('keyup', (e) => keys[e.key] = false);

        canvas.addEventListener('touchstart', (e) => {
            if (gameState !== 'PLAYING') return;
            const touch = e.touches[0]; const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width; const scaleY = canvas.height / rect.height;
            joystick.active = true;
            joystick.startX = (touch.clientX - rect.left) * scaleX;
            joystick.startY = (touch.clientY - rect.top) * scaleY;
            joystick.moveX = 0; joystick.moveY = 0;
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            if (!joystick.active) return;
            const touch = e.touches[0]; const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width; const scaleY = canvas.height / rect.height;
            const dx = (touch.clientX - rect.left) * scaleX - joystick.startX;
            const dy = (touch.clientY - rect.top) * scaleY - joystick.startY;
            const dist = Math.hypot(dx, dy); const maxR = 50;
            if (dist > 0) { joystick.moveX = (dx / dist) * Math.min(dist, maxR) / maxR; joystick.moveY = (dy / dist) * Math.min(dist, maxR) / maxR; }
        }, { passive: false });

        canvas.addEventListener('touchend', () => { joystick.active = false; joystick.moveX = 0; joystick.moveY = 0; });

        let enemySpawnTimer = 0;

        function generateRocks() {
            rocks = [];
            for (let i = 0; i < 45; i++) {
                rocks.push({
                    x: 200 + Math.random() * (WORLD_WIDTH - 400),
                    y: 200 + Math.random() * (WORLD_HEIGHT - 400),
                    radius: 25 + Math.random() * 15
                });
            }
        }

        function createExplosion(x, y, color, count = 8) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 1 + Math.random() * 3;
                particles.push({
                    x: x, y: y,
                    vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
                    radius: 2 + Math.random() * 3,
                    color: color, life: 20 + Math.random() * 15
                });
            }
        }

        function updateUI() {
            document.getElementById('menuGoldDisplay').innerText = savedData.gold;
            document.getElementById('shopGoldDisplay').innerText = savedData.gold;
            document.getElementById('charGoldDisplay').innerText = savedData.gold;
            document.getElementById('dmgCost').innerText = (savedData.dmgLevel + 1) * 50;
            document.getElementById('hpCost').innerText = (savedData.hpLevel + 1) * 50;
            document.getElementById('speedCost').innerText = (savedData.speedLevel + 1) * 50;
            document.getElementById('magnetCost').innerText = (savedData.magnetLevel + 1) * 50;
        }

        function openUpgradeShop() { mainMenu.style.display = 'none'; upgradeShop.style.display = 'block'; updateUI(); }
        function closeUpgradeShop() { upgradeShop.style.display = 'none'; mainMenu.style.display = 'block'; updateUI(); }

        function openCharSelect() { mainMenu.style.display = 'none'; charSelect.style.display = 'block'; renderCharList(); updateUI(); }
        function closeCharSelect() { charSelect.style.display = 'none'; mainMenu.style.display = 'block'; updateUI(); }

        function renderCharList() {
            charListContainer.innerHTML = '';
            for (let key in CHARACTERS) {
                const char = CHARACTERS[key];
                const isUnlocked = savedData.unlockedChars.includes(key);
                const isSelected = savedData.selectedChar === key;

                const card = document.createElement('div');
                card.className = `charCard ${isSelected ? 'selected' : ''}`;
                card.innerHTML = `
                    <div style="text-align: left;">
                        <strong style="color: #FFD700;">${char.name}</strong>
                        <div style="font-size: 11px; color: #aaa;">${char.desc}</div>
                    </div>
                    <div>
                        ${isSelected ? '<span style="color: #00FF66; font-size: 12px;">使用中</span>' :
                          isUnlocked ? `<button class="upgradeBtn" onclick="selectChar('${key}')">選擇</button>` :
                          `<button class="upgradeBtn" style="background: #e67e22;" onclick="unlockChar('${key}')">解鎖 (${char.price}💰)</button>`}
                    </div>
                `;
                charListContainer.appendChild(card);
            }
        }

        function selectChar(key) { savedData.selectedChar = key; saveGame(); renderCharList(); }
        function unlockChar(key) {
            const char = CHARACTERS[key];
            if (savedData.gold >= char.price) {
                savedData.gold -= char.price; savedData.unlockedChars.push(key);
                savedData.selectedChar = key; saveGame(); updateUI(); renderCharList();
            }
        }

        function buyUpgrade(type) {
            const costs = {
                dmg: (savedData.dmgLevel + 1) * 50, hp: (savedData.hpLevel + 1) * 50,
                speed: (savedData.speedLevel + 1) * 50, magnet: (savedData.magnetLevel + 1) * 50
            };
            if (savedData.gold >= costs[type]) {
                savedData.gold -= costs[type];
                if (type === 'dmg') { savedData.dmgMultiplier += 0.15; savedData.dmgLevel++; }
                else if (type === 'hp') { savedData.baseHp += 20; savedData.hpLevel++; }
                else if (type === 'speed') { savedData.baseSpeed += 0.5; savedData.speedLevel++; }
                else if (type === 'magnet') { savedData.baseMagnet += 25; savedData.magnetLevel++; }
                saveGame(); updateUI();
            }
        }

        function togglePause() {
            if (gameState === 'PLAYING') {
                gameState = 'PAUSED';
                pauseGoldText.innerText = sessionGold;
                pauseMenu.style.display = 'block';
            } else if (gameState === 'PAUSED') {
                gameState = 'PLAYING';
                pauseMenu.style.display = 'none';
                gameLoop();
            }
        }

        function exitGameFromPause() {
            pauseMenu.style.display = 'none';
            pauseBtn.style.display = 'none';
            savedData.gold += sessionGold;
            saveGame();
            if (bgmTimer) clearInterval(bgmTimer);
            returnToMainMenu();
        }

        function startGame() {
            mainMenu.style.display = 'none'; upgradeShop.style.display = 'none';
            charSelect.style.display = 'none'; gameOverMenu.style.display = 'none';
            pauseMenu.style.display = 'none';
            pauseBtn.style.display = 'block';

            const charConfig = CHARACTERS[savedData.selectedChar] || CHARACTERS.eevee;

            player = {
                x: WORLD_WIDTH / 2, y: WORLD_HEIGHT / 2, radius: 20, pokemonId: charConfig.id,
                speed: savedData.baseSpeed + charConfig.bonusSpeed,
                magnetRadius: savedData.baseMagnet + charConfig.bonusMag,
                level: 1, exp: 0, maxExp: 5, hp: savedData.baseHp, maxHp: savedData.baseHp, invincibleTimer: 0,
                healLevel: 0, healTimer: 0,
                moves: [
                    { id: 'tb', name: '十萬伏特', type: 'electric', level: 1, cooldown: 35, timer: 0, dmg: 4, evolved: false },
                    { id: 'flame', name: '噴射火焰', type: 'fire', level: 0, cooldown: 50, timer: 0, dmg: 6 },
                    { id: 'leaf', name: '葉風暴', type: 'grass', level: 0, cooldown: 0, timer: 0, dmg: 2 },
                    { id: 'hydro', name: '水砲', type: 'water', level: 0, cooldown: 65, timer: 0, dmg: 10 }
                ],
                leafAngle: 0
            };

            bullets = []; enemies = []; gems = []; particles = []; chests = []; damageTexts = [];
            sessionGold = 0; enemySpawnTimer = 0; screenShakeTime = 0; gameTimeFrames = 0;
            currentWeather = 'NORMAL'; weatherTimer = 0;

            generateRocks();
            startBGM();

            gameState = 'PLAYING'; gameLoop();
        }

        function spawnEnemy() {
            const spawnAngle = Math.random() * Math.PI * 2;
            const spawnDist = 450 + Math.random() * 150;
            let x = player.x + Math.cos(spawnAngle) * spawnDist;
            let y = player.y + Math.sin(spawnAngle) * spawnDist;

            const wildList = [
                { id: 4, type: 'fire' }, { id: 7, type: 'water' },
                { id: 1, type: 'grass' }, { id: 19, type: 'electric' }
            ];
            const pData = wildList[Math.floor(Math.random() * wildList.length)];
            const isShiny = Math.random() < 0.05;

            const timeScaling = Math.floor(gameTimeFrames / 1800) * 2;
            const baseHp = (isShiny ? 15 : 4) + Math.floor(player.level * 1.5) + timeScaling;

            enemies.push({
                x: x, y: y, radius: 18, speed: isShiny ? 2.2 : 1.4,
                hp: baseHp, maxHp: baseHp,
                pokemonId: pData.id, type: pData.type, isShiny: isShiny, isBoss: false,
                damage: isShiny ? 25 : 12, flashTimer: 0
            });
        }

        function spawnBoss() {
            const spawnAngle = Math.random() * Math.PI * 2;
            let x = player.x + Math.cos(spawnAngle) * 400;
            let y = player.y + Math.sin(spawnAngle) * 400;

            const timeScaling = Math.floor(gameTimeFrames / 1800) * 15;
            const bossHp = 100 + player.level * 30 + timeScaling;

            enemies.push({
                x: x, y: y, radius: 45, speed: 0.8,
                hp: bossHp, maxHp: bossHp,
                type: 'fire', isShiny: false, isBoss: true, damage: 30, flashTimer: 0
            });
        }

        function castMove(move) {
            if (enemies.length === 0) return;

            let closest = null, minDist = Infinity;
            enemies.forEach(e => {
                const d = Math.hypot(e.x - player.x, e.y - player.y);
                if (d < minDist) { minDist = d; closest = e; }
            });

            if (closest) {
                playSound('shoot');
                const angle = Math.atan2(closest.y - player.y, closest.x - player.x);
                let finalDmg = move.dmg * savedData.dmgMultiplier;

                if (currentWeather === 'RAIN' && (move.type === 'water' || move.type === 'electric')) finalDmg *= 1.3;
                if (currentWeather === 'SUNNY' && move.type === 'fire') finalDmg *= 1.3;

                const count = move.evolved ? 3 : 1;
                const spread = 0.2;
                const startA = angle - ((count - 1) * spread) / 2;

                for (let k = 0; k < count; k++) {
                    bullets.push({
                        x: player.x, y: player.y,
                        vx: Math.cos(startA + k * spread) * 9, vy: Math.sin(startA + k * spread) * 9,
                        radius: move.evolved ? 8 : (move.type === 'hydro' ? 10 : 5),
                        color: move.evolved ? '#00FFFF' : (move.type === 'electric' ? '#FFD700' : move.type === 'fire' ? '#FF4500' : '#00FF66'),
                        type: move.type, damage: finalDmg
                    });
                }
            }
        }

        function showLevelUpMenu() {
            playSound('levelup');
            createExplosion(player.x, player.y, '#00FF66', 15);

            const availableUpgrades = [
                { name: '💚 學習/升級 [光合作用] (自動回血)', action: () => player.healLevel++ },
                { name: '🔥 學習/升級 [噴射火焰]', action: () => player.moves[1].level++ },
                { name: '🍃 學習/升級 [葉風暴]', action: () => player.moves[2].level++ },
                { name: '💧 學習/升級 [水砲]', action: () => player.moves[3].level++ },
                { 
                    name: player.moves[0].level >= 5 && !player.moves[0].evolved ? '⚡ 超進化！【打雷 (Thunder)】' : '⚡ 強化 [十萬伏特]', 
                    action: () => {
                        player.moves[0].level++;
                        if (player.moves[0].level >= 5) player.moves[0].evolved = true;
                        player.moves[0].dmg += 3;
                        player.moves[0].cooldown = Math.max(12, player.moves[0].cooldown - 4);
                    }
                },
                { name: '🧲 擴大拾取範圍 (+30)', action: () => player.magnetRadius += 30 },
                { name: '⚡ 提升移動速度 (+0.8)', action: () => player.speed += 0.8 }
            ];

            const shuffled = availableUpgrades.sort(() => 0.5 - Math.random()).slice(0, 3);
            upgradeOptionsContainer.innerHTML = '';
            shuffled.forEach(upg => {
                const btn = document.createElement('button');
                btn.className = 'optionBtn'; btn.innerText = upg.name;
                btn.onclick = () => { upg.action(); levelUpMenu.style.display = 'none'; gameState = 'PLAYING'; gameLoop(); };
                upgradeOptionsContainer.appendChild(btn);
            });
            levelUpMenu.style.display = 'block';
        }

        function addExp(amount, isShiny = false) {
            playSound('gem');
            player.exp += amount;
            sessionGold += isShiny ? 100 : 10;

            if (player.exp >= player.maxExp) {
                player.exp -= player.maxExp; player.level += 1;
                player.maxExp = Math.floor(player.maxExp * 1.4);

                if (player.level % 5 === 0) spawnBoss();

                gameState = 'PAUSED'; showLevelUpMenu();
            }
        }

        function triggerGameOver() {
            gameState = 'GAMEOVER'; savedData.gold += sessionGold; saveGame();
            pauseBtn.style.display = 'none';
            if (bgmTimer) clearInterval(bgmTimer);
            finalScoreText.innerText = `你在戰場上存活到了等級 ${player.level}！`;
            earnedGoldText.innerText = sessionGold; gameOverMenu.style.display = 'block';
        }

        function returnToMainMenu() {
            gameOverMenu.style.display = 'none'; pauseBtn.style.display = 'none';
            mainMenu.style.display = 'block';
            gameState = 'MENU'; updateUI(); drawMenuBackground();
        }

        function drawMenuBackground() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#1b2631"; ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function gameLoop() {
            if (gameState !== 'PLAYING') return;

            gameTimeFrames++;

            let moveX = 0, moveY = 0;
            if (keys['w'] || keys['W'] || keys['ArrowUp']) moveY -= 1;
            if (keys['s'] || keys['S'] || keys['ArrowDown']) moveY += 1;
            if (keys['a'] || keys['A'] || keys['ArrowLeft']) moveX -= 1;
            if (keys['d'] || keys['D'] || keys['ArrowRight']) moveX += 1;
            if (joystick.active) { moveX = joystick.moveX; moveY = joystick.moveY; }

            let nextX = player.x + moveX * player.speed;
            let nextY = player.y + moveY * player.speed;

            rocks.forEach(r => {
                const dist = Math.hypot(nextX - r.x, nextY - r.y);
                if (dist < player.radius + r.radius) {
                    const angle = Math.atan2(nextY - r.y, nextX - r.x);
                    nextX = r.x + Math.cos(angle) * (player.radius + r.radius);
                    nextY = r.y + Math.sin(angle) * (player.radius + r.radius);
                }
            });

            player.x = Math.max(player.radius, Math.min(WORLD_WIDTH - player.radius, nextX));
            player.y = Math.max(player.radius, Math.min(WORLD_HEIGHT - player.radius, nextY));

            camera.x = player.x - canvas.width / 2; camera.y = player.y - canvas.height / 2;

            if (player.invincibleTimer > 0) player.invincibleTimer--;

            if (player.healLevel > 0) {
                player.healTimer++;
                const healInterval = Math.max(120, 300 - player.healLevel * 40);
                if (player.healTimer >= healInterval) {
                    const healAmount = 10 + player.healLevel * 5;
                    player.hp = Math.min(player.maxHp, player.hp + healAmount);
                    playSound('heal');
                    createExplosion(player.x, player.y, '#00FF66', 8);
                    damageTexts.push({
                        x: player.x, y: player.y - 15,
                        text: `+${healAmount} HP`, color: '#00FF66', opacity: 1.0
                    });
                    player.healTimer = 0;
                }
            }

            weatherTimer++;
            if (weatherTimer >= 600) {
                const wList = ['NORMAL', 'RAIN', 'SUNNY'];
                currentWeather = wList[Math.floor(Math.random() * wList.length)];
                weatherTimer = 0;
            }

            player.moves.forEach(m => {
                if (m.level > 0 && m.cooldown > 0) {
                    m.timer++;
                    if (m.timer >= m.cooldown) { castMove(m); m.timer = 0; }
                }
            });

            if (player.moves[2].level > 0) player.leafAngle += 0.06;

            enemySpawnTimer++;
            if (enemySpawnTimer >= 45) { spawnEnemy(); enemySpawnTimer = 0; }

            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i]; b.x += b.vx; b.y += b.vy;
                if (Math.hypot(b.x - player.x, b.y - player.y) > 800) bullets.splice(i, 1);
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx; p.y += p.vy; p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            }

            for (let i = chests.length - 1; i >= 0; i--) {
                const c = chests[i];
                if (Math.hypot(player.x - c.x, player.y - c.y) < player.radius + 15) {
                    playSound('chest'); sessionGold += 150; addExp(5);
                    createExplosion(c.x, c.y, '#FFD700', 20); chests.splice(i, 1);
                }
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                if (e.flashTimer > 0) e.flashTimer--;

                let eNextX = e.x + Math.cos(Math.atan2(player.y - e.y, player.x - e.x)) * e.speed;
                let eNextY = e.y + Math.sin(Math.atan2(player.y - e.y, player.x - e.x)) * e.speed;

                rocks.forEach(r => {
                    if (Math.hypot(eNextX - r.x, eNextY - r.y) < e.radius + r.radius) {
                        const angle = Math.atan2(eNextY - r.y, eNextX - r.x);
                        eNextX = r.x + Math.cos(angle) * (e.radius + r.radius);
                        eNextY = r.y + Math.sin(angle) * (e.radius + r.radius);
                    }
                });

                e.x = eNextX; e.y = eNextY;

                if (Math.hypot(player.x - e.x, player.y - e.y) < player.radius + e.radius && player.invincibleTimer === 0) {
                    player.hp -= e.damage; player.invincibleTimer = 30;
                    screenShakeTime = 8;
                    if (player.hp <= 0) { player.hp = 0; triggerGameOver(); return; }
                }

                if (player.moves[2].level > 0) {
                    const leafDist = 70;
                    for (let k = 0; k < player.moves[2].level; k++) {
                        const lAngle = player.leafAngle + (Math.PI * 2 / player.moves[2].level) * k;
                        const lx = player.x + Math.cos(lAngle) * leafDist;
                        const ly = player.y + Math.sin(lAngle) * leafDist;
                        if (Math.hypot(lx - e.x, ly - e.y) < e.radius + 12) {
                            let dmg = 0.3 * savedData.dmgMultiplier;
                            const mult = TYPE_CHART['grass'][e.type] || 1.0;
                            e.hp -= dmg * mult;
                        }
                    }
                }

                for (let j = bullets.length - 1; j >= 0; j--) {
                    const b = bullets[j];
                    if (Math.hypot(b.x - e.x, b.y - e.y) < b.radius + e.radius) {
                        const mult = TYPE_CHART[b.type][e.type] || 1.0;
                        const finalDmg = b.damage * mult;
                        e.hp -= finalDmg; e.flashTimer = 4;
                        playSound('hit');

                        if (e.isBoss || e.isShiny) screenShakeTime = 4;

                        damageTexts.push({
                            x: e.x, y: e.y - 10,
                            text: mult > 1.0 ? `${Math.floor(finalDmg)}! Effective` : `${Math.floor(finalDmg)}`,
                            color: mult > 1.0 ? '#FFD700' : '#ffffff', opacity: 1.0
                        });

                        bullets.splice(j, 1);
                        if (e.hp <= 0) break;
                    }
                }

                if (e.hp <= 0) {
                    createExplosion(e.x, e.y, e.isShiny ? '#FFD700' : '#FF4444');
                    if (e.isBoss) { chests.push({ x: e.x, y: e.y }); }
                    else { gems.push({ x: e.x, y: e.y, radius: e.isShiny ? 14 : 10, isShiny: e.isShiny }); }
                    enemies.splice(i, 1);
                }
            }

            for (let i = gems.length - 1; i >= 0; i--) {
                const g = gems[i];
                const dist = Math.hypot(player.x - g.x, player.y - g.y);
                if (dist < player.magnetRadius) {
                    const angle = Math.atan2(player.y - g.y, player.x - g.x);
                    g.x += Math.cos(angle) * 6.5; g.y += Math.sin(angle) * 6.5;
                }
                if (dist < player.radius + g.radius) {
                    addExp(g.isShiny ? 5 : 1, g.isShiny); gems.splice(i, 1);
                }
            }

            for (let i = damageTexts.length - 1; i >= 0; i--) {
                const dt = damageTexts[i]; dt.y -= 0.5; dt.opacity -= 0.02;
                if (dt.opacity <= 0) damageTexts.splice(i, 1);
            }

            // --- 繪製畫面 ---
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();

            let offsetX = 0, offsetY = 0;
            if (screenShakeTime > 0) {
                offsetX = (Math.random() - 0.5) * 6;
                offsetY = (Math.random() - 0.5) * 6;
                screenShakeTime--;
            }

            ctx.translate(-camera.x + offsetX, -camera.y + offsetY);

            ctx.strokeStyle = '#2c3e50'; ctx.lineWidth = 1;
            const gridSize = 100;
            for (let x = 0; x <= WORLD_WIDTH; x += gridSize) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, WORLD_HEIGHT); ctx.stroke();
            }
            for (let y = 0; y <= WORLD_HEIGHT; y += gridSize) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(WORLD_WIDTH, y); ctx.stroke();
            }

            rocks.forEach(r => {
                ctx.beginPath(); ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#4a5568'; ctx.fill();
                ctx.strokeStyle = '#718096'; ctx.lineWidth = 3; ctx.stroke(); ctx.closePath();
            });

            ctx.strokeStyle = '#FF0000'; ctx.lineWidth = 5;
            ctx.strokeRect(0, 0, WORLD_WIDTH, WORLD_HEIGHT);

            chests.forEach(c => {
                ctx.fillStyle = '#FFD700'; ctx.fillRect(c.x - 12, c.y - 10, 24, 20);
                ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 2; ctx.strokeRect(c.x - 12, c.y - 10, 24, 20);
            });

            gems.forEach(g => {
                const img = g.isShiny ? images.shinyBall : images.ball;
                if (img.complete && img.naturalWidth !== 0) {
                    ctx.drawImage(img, g.x - 12, g.y - 12, 24, 24);
                } else {
                    ctx.beginPath(); ctx.arc(g.x, g.y, g.radius, 0, Math.PI * 2);
                    ctx.fillStyle = g.isShiny ? '#FFD700' : '#00FF66'; ctx.fill(); ctx.closePath();
                }
            });

            particles.forEach(p => {
                ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color; ctx.fill(); ctx.closePath();
            });

            ctx.beginPath();
            ctx.arc(player.x, player.y, player.magnetRadius, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0, 255, 255, 0.04)'; ctx.fill();
            ctx.strokeStyle = 'rgba(0, 255, 255, 0.15)'; ctx.stroke();
            ctx.closePath();

            if (player.moves[2].level > 0) {
                const leafDist = 70;
                for (let k = 0; k < player.moves[2].level; k++) {
                    const lAngle = player.leafAngle + (Math.PI * 2 / player.moves[2].level) * k;
                    const lx = player.x + Math.cos(lAngle) * leafDist;
                    const ly = player.y + Math.sin(lAngle) * leafDist;
                    ctx.beginPath(); ctx.arc(lx, ly, 10, 0, Math.PI * 2);
                    ctx.fillStyle = '#00FF66'; ctx.fill(); ctx.closePath();
                }
            }

            const pImg = getPokemonImg(player.pokemonId);
            if (player.invincibleTimer % 6 < 3) {
                if (pImg.complete && pImg.naturalWidth !== 0) {
                    ctx.drawImage(pImg, player.x - 30, player.y - 30, 60, 60);
                }
            }

            bullets.forEach(b => {
                ctx.beginPath(); ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fillStyle = b.color; ctx.fill(); ctx.closePath();
            });

            enemies.forEach(e => {
                const eImg = e.isBoss ? images.boss : getPokemonImg(e.pokemonId, e.isShiny);
                const imgSize = e.isBoss ? 110 : 50;

                if (e.flashTimer > 0) {
                    ctx.beginPath(); ctx.arc(e.x, e.y, e.radius + 2, 0, Math.PI * 2);
                    ctx.fillStyle = '#FFFFFF'; ctx.fill(); ctx.closePath();
                } else if (eImg.complete && eImg.naturalWidth !== 0) {
                    ctx.drawImage(eImg, e.x - imgSize / 2, e.y - imgSize / 2, imgSize, imgSize);
                }

                if (e.isShiny) {
                    ctx.fillStyle = '#FFD700'; ctx.font = "bold 12px sans-serif";
                    ctx.fillText('✨ Shiny', e.x - 20, e.y - 28);
                }

                const barWidth = e.isBoss ? 60 : 28;
                const barHeight = e.isBoss ? 6 : 4;
                const barOffsetY = e.radius + (e.isBoss ? 15 : 10);

                ctx.fillStyle = 'rgba(0, 0, 0, 0.6)'; ctx.fillRect(e.x - barWidth / 2, e.y - barOffsetY, barWidth, barHeight);
                ctx.fillStyle = e.isBoss ? '#00FF00' : '#32CD32';
                ctx.fillRect(e.x - barWidth / 2, e.y - barOffsetY, Math.max(0, (e.hp / e.maxHp) * barWidth), barHeight);
            });

            damageTexts.forEach(dt => {
                ctx.fillStyle = dt.color; ctx.font = "bold 13px sans-serif";
                ctx.globalAlpha = dt.opacity; ctx.fillText(dt.text, dt.x - 10, dt.y);
                ctx.globalAlpha = 1.0;
            });

            ctx.restore();

            if (joystick.active) {
                ctx.beginPath(); ctx.arc(joystick.startX, joystick.startY, 50, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.15)'; ctx.fill();
                ctx.beginPath(); ctx.arc(joystick.startX + joystick.moveX * 50, joystick.startY + joystick.moveY * 50, 20, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 215, 0, 0.6)'; ctx.fill();
            }

            ctx.fillStyle = "white"; ctx.font = "14px sans-serif";
            ctx.fillText(`血量: ${Math.floor(player.hp)} / ${player.maxHp}`, 65, 25);
            ctx.fillStyle = "#444"; ctx.fillRect(65, 30, 130, 8);
            ctx.fillStyle = "#FF4444"; ctx.fillRect(65, 30, Math.max(0, (player.hp / player.maxHp) * 130), 8);

            ctx.fillStyle = "white"; ctx.fillText(`等級: ${player.level}`, 65, 55);
            ctx.fillStyle = "#444"; ctx.fillRect(65, 60, 130, 8);
            ctx.fillStyle = "#00FF66"; ctx.fillRect(65, 60, (player.exp / player.maxExp) * 130, 8);

            ctx.fillStyle = "#FFD700"; ctx.font = "12px sans-serif";
            ctx.fillText(`💰 金幣: ${sessionGold}`, 65, 85);
            ctx.fillText(`⏱ 時間: ${Math.floor(gameTimeFrames / 60)}s`, 65, 100);
            ctx.fillText(`🌤 天氣: ${currentWeather === 'RAIN' ? '🌧️ 暴風雨' : currentWeather === 'SUNNY' ? '☀️ 烈日' : '晴朗'}`, 65, 115);

            requestAnimationFrame(gameLoop);
        }

        drawMenuBackground(); updateUI();
    </script>
</body>
</html>
