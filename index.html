<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <!-- iOS / Android のズーム・スクロール防止レスポンシブ設定 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>寶可夢肉鴿大冒險</title>
    <style>
        * {
            box-sizing: border-box;
            touch-action: none; /* スマホのスクロールやピンチズームを完全無効化 */
            -webkit-touch-callout: none; /* iOS の長押しメニュー無効化 */
            -webkit-user-select: none;   /* テキスト選択無効化 */
            user-select: none;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: sans-serif;
            color: white;
        }
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            border: 2px solid #555;
            background-color: #1b2631;
            display: block;
            /* 画面サイズに合わせて自動スケーリング（全端末対応） */
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .uiOverlay {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.95);
            border: 3px solid #FFD700;
            padding: 20px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.5);
            z-index: 10;
            width: 85%;
            max-width: 380px;
        }
        .optionBtn {
            display: block;
            width: 100%;
            margin: 10px auto;
            padding: 12px;
            background-color: #333;
            color: white;
            border: 2px solid #666;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
        }
        .optionBtn:hover {
            background-color: #555;
            border-color: #FFD700;
        }
        .upgradeRow {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 10px 0;
            background: #222;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #444;
            font-size: 14px;
        }
        .upgradeBtn {
            padding: 6px 10px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <!-- 1. 主選單 (Start Menu) -->
        <div id="mainMenu" class="uiOverlay" style="display: block;">
            <h2 style="color: #FFD700; margin-top: 0;">⚡ 寶可夢肉鴿大冒險</h2>
            <p style="color: #aaa; font-size: 13px;">累積金幣，強化屬性，挑戰極限！</p>
            <p style="color: #FFD700; font-size: 16px;">💰 當前金幣: <span id="menuGoldDisplay">0</span></p>
            <button class="optionBtn" style="background-color: #1e8449; border-color: #2ecc71;" onclick="startGame()">▶ 開始遊戲 (Start)</button>
            <button class="optionBtn" onclick="openUpgradeShop()">🛠 屬性強化 (Upgrade)</button>
        </div>

        <!-- 2. 局外強化商店 -->
        <div id="upgradeShop" class="uiOverlay">
            <h3 style="color: #FFD700; margin-top: 0;">🛠 局外屬性強化</h3>
            <p style="color: #FFD700; font-size: 15px;">💰 金幣: <span id="shopGoldDisplay">0</span></p>
            
            <div class="upgradeRow">
                <div style="text-align: left;">
                    <div>❤️ 生命上限 (+20)</div>
                    <small style="color: #aaa;">當前: <span id="hpStat">100</span></small>
                </div>
                <button class="upgradeBtn" onclick="buyUpgrade('hp')">升級 (<span id="hpCost">50</span>💰)</button>
            </div>

            <div class="upgradeRow">
                <div style="text-align: left;">
                    <div>⚡ 基礎移速 (+0.5)</div>
                    <small style="color: #aaa;">當前: <span id="speedStat">2.0</span></small>
                </div>
                <button class="upgradeBtn" onclick="buyUpgrade('speed')">升級 (<span id="speedCost">50</span>💰)</button>
            </div>

            <div class="upgradeRow">
                <div style="text-align: left;">
                    <div>🔥 基礎攻速 (-3幀)</div>
                    <small style="color: #aaa;">冷卻: <span id="rateStat">40</span></small>
                </div>
                <button class="upgradeBtn" onclick="buyUpgrade('rate')">升級 (<span id="rateCost">50</span>💰)</button>
            </div>

            <div class="upgradeRow">
                <div style="text-align: left;">
                    <div>🧲 磁力範圍 (+25)</div>
                    <small style="color: #aaa;">範圍: <span id="magnetStat">80</span></small>
                </div>
                <button class="upgradeBtn" onclick="buyUpgrade('magnet')">升級 (<span id="magnetCost">50</span>💰)</button>
            </div>

            <button class="optionBtn" style="margin-top: 15px;" onclick="closeUpgradeShop()">🔙 返回主選單</button>
        </div>

        <!-- 3. 局內升級選單 -->
        <div id="levelUpMenu" class="uiOverlay">
            <h3 style="color: #FFD700; margin-top: 0;">🎉 等級提升！</h3>
            <p style="font-size: 13px;">請選擇一個強化能力：</p>
            <div id="upgradeOptionsContainer"></div>
        </div>

        <!-- 4. Game Over 結算畫面 -->
        <div id="gameOverMenu" class="uiOverlay" style="border-color: #FF4444;">
            <h3 style="color: #FF4444; margin-top: 0;">💀 遊戲結束</h3>
            <p id="finalScoreText" style="font-size: 14px;">你達到了等級 1！</p>
            <p style="color: #FFD700; font-size: 15px;">本次獲得金幣: +<span id="earnedGoldText">0</span> 💰</p>
            <button class="optionBtn" style="border-color: #FF4444;" onclick="returnToMainMenu()">🏠 返回主選單</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const mainMenu = document.getElementById('mainMenu');
        const upgradeShop = document.getElementById('upgradeShop');
        const levelUpMenu = document.getElementById('levelUpMenu');
        const gameOverMenu = document.getElementById('gameOverMenu');
        const finalScoreText = document.getElementById('finalScoreText');
        const earnedGoldText = document.getElementById('earnedGoldText');
        const upgradeOptionsContainer = document.getElementById('upgradeOptionsContainer');

        const WORLD_WIDTH = 3000;
        const WORLD_HEIGHT = 3000;

        let gameState = 'MENU';

        // 端末の画面アスペクト比に応じて Canvas 解像度を動的調整
        function resizeCanvas() {
            const isMobile = window.innerWidth < window.innerHeight;
            if (isMobile) {
                // スマホ（縦画面）
                canvas.width = 450;
                canvas.height = 800;
            } else {
                // パソコン・タブレット（横画面）
                canvas.width = 1000;
                canvas.height = 650;
            }
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // 画像リソース
        const images = {
            player: new Image(),
            enemy: new Image(),
            boss: new Image(),
            ball: new Image()
        };

        images.player.src = 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/133.png'; // イーブイ
        images.enemy.src = 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/4.png';   // ヒトカゲ
        images.boss.src = 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/6.png';    // リザードン
        images.ball.src = 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png'; // モンスターボール

        let savedData = {
            gold: 0,
            baseHp: 100,
            baseSpeed: 2,
            baseShootRate: 40,
            baseMagnetRadius: 80,
            hpLevel: 0,
            speedLevel: 0,
            rateLevel: 0,
            magnetLevel: 0
        };

        let player = {};
        let sessionGold = 0;

        const camera = { x: 0, y: 0 };
        let bullets = [];
        let enemies = [];
        let gems = [];

        // タッチジョイスティック（iOS / Android 対応）
        let joystick = {
            active: false,
            startX: 0,
            startY: 0,
            moveX: 0,
            moveY: 0
        };

        const keys = {};
        window.addEventListener('keydown', (e) => keys[e.key] = true);
        window.addEventListener('keyup', (e) => keys[e.key] = false);

        // iOS / Android 共通タッチイベント処理
        function handleTouchStart(e) {
            if (gameState !== 'PLAYING') return;
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            
            // キャンバス内の実際の表示スケールを考慮
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            joystick.active = true;
            joystick.startX = (touch.clientX - rect.left) * scaleX;
            joystick.startY = (touch.clientY - rect.top) * scaleY;
            joystick.moveX = 0;
            joystick.moveY = 0;
        }

        function handleTouchMove(e) {
            if (!joystick.active) return;
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();

            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            const currentX = (touch.clientX - rect.left) * scaleX;
            const currentY = (touch.clientY - rect.top) * scaleY;

            const dx = currentX - joystick.startX;
            const dy = currentY - joystick.startY;
            const dist = Math.hypot(dx, dy);
            const maxRadius = 50;

            if (dist > 0) {
                joystick.moveX = (dx / dist) * Math.min(dist, maxRadius) / maxRadius;
                joystick.moveY = (dy / dist) * Math.min(dist, maxRadius) / maxRadius;
            }
        }

        function handleTouchEnd() {
            joystick.active = false;
            joystick.moveX = 0;
            joystick.moveY = 0;
        }

        canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
        canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
        canvas.addEventListener('touchend', handleTouchEnd, { passive: false });

        let enemySpawnTimer = 0;

        function updateUI() {
            document.getElementById('menuGoldDisplay').innerText = savedData.gold;
            document.getElementById('shopGoldDisplay').innerText = savedData.gold;

            document.getElementById('hpStat').innerText = savedData.baseHp;
            document.getElementById('speedStat').innerText = savedData.baseSpeed.toFixed(1);
            document.getElementById('rateStat').innerText = savedData.baseShootRate;
            document.getElementById('magnetStat').innerText = savedData.baseMagnetRadius;

            document.getElementById('hpCost').innerText = (savedData.hpLevel + 1) * 50;
            document.getElementById('speedCost').innerText = (savedData.speedLevel + 1) * 50;
            document.getElementById('rateCost').innerText = (savedData.rateLevel + 1) * 50;
            document.getElementById('magnetCost').innerText = (savedData.magnetLevel + 1) * 50;
        }

        function openUpgradeShop() {
            mainMenu.style.display = 'none';
            upgradeShop.style.display = 'block';
            updateUI();
        }

        function closeUpgradeShop() {
            upgradeShop.style.display = 'none';
            mainMenu.style.display = 'block';
            updateUI();
        }

        function buyUpgrade(type) {
            if (type === 'hp') {
                const cost = (savedData.hpLevel + 1) * 50;
                if (savedData.gold >= cost) {
                    savedData.gold -= cost;
                    savedData.baseHp += 20;
                    savedData.hpLevel++;
                }
            } else if (type === 'speed') {
                const cost = (savedData.speedLevel + 1) * 50;
                if (savedData.gold >= cost) {
                    savedData.gold -= cost;
                    savedData.baseSpeed += 0.5;
                    savedData.speedLevel++;
                }
            } else if (type === 'rate') {
                const cost = (savedData.rateLevel + 1) * 50;
                if (savedData.gold >= cost && savedData.baseShootRate > 10) {
                    savedData.gold -= cost;
                    savedData.baseShootRate -= 3;
                    savedData.rateLevel++;
                }
            } else if (type === 'magnet') {
                const cost = (savedData.magnetLevel + 1) * 50;
                if (savedData.gold >= cost) {
                    savedData.gold -= cost;
                    savedData.baseMagnetRadius += 25;
                    savedData.magnetLevel++;
                }
            }
            updateUI();
        }

        function startGame() {
            mainMenu.style.display = 'none';
            upgradeShop.style.display = 'none';
            gameOverMenu.style.display = 'none';

            player = {
                x: WORLD_WIDTH / 2,
                y: WORLD_HEIGHT / 2,
                radius: 20,
                speed: savedData.baseSpeed,
                shootCooldown: 0,
                shootRate: savedData.baseShootRate,
                bulletCount: 1,
                magnetRadius: savedData.baseMagnetRadius,
                level: 1,
                exp: 0,
                maxExp: 5,
                hp: savedData.baseHp,
                maxHp: savedData.baseHp,
                invincibleTimer: 0
            };

            bullets = [];
            enemies = [];
            gems = [];
            sessionGold = 0;
            enemySpawnTimer = 0;

            gameState = 'PLAYING';
            gameLoop();
        }

        function spawnEnemy() {
            const spawnAngle = Math.random() * Math.PI * 2;
            const spawnDist = 450 + Math.random() * 150;
            let x = player.x + Math.cos(spawnAngle) * spawnDist;
            let y = player.y + Math.sin(spawnAngle) * spawnDist;

            x = Math.max(20, Math.min(WORLD_WIDTH - 20, x));
            y = Math.max(20, Math.min(WORLD_HEIGHT - 20, y));

            const enemyHp = 3 + Math.floor((player.level - 1) * 1.5);

            enemies.push({
                x: x, y: y,
                radius: 18,
                speed: 1.5,
                hp: enemyHp,
                maxHp: enemyHp,
                isBoss: false,
                damage: 15
            });
        }

        function spawnBoss() {
            const spawnAngle = Math.random() * Math.PI * 2;
            let x = player.x + Math.cos(spawnAngle) * 400;
            let y = player.y + Math.sin(spawnAngle) * 400;

            const bossHp = 100 + player.level * 30;

            enemies.push({
                x: x, y: y,
                radius: 45,
                speed: 0.8,
                hp: bossHp,
                maxHp: bossHp,
                isBoss: true,
                damage: 35
            });
        }

        function autoShoot() {
            if (enemies.length === 0) return;

            let closestEnemy = null;
            let minDistance = Infinity;

            enemies.forEach(enemy => {
                const dist = Math.hypot(enemy.x - player.x, enemy.y - player.y);
                if (dist < minDistance) {
                    minDistance = dist;
                    closestEnemy = enemy;
                }
            });

            if (closestEnemy) {
                const baseAngle = Math.atan2(closestEnemy.y - player.y, closestEnemy.x - player.x);
                const spreadAngle = 0.2; 
                const startAngle = baseAngle - ((player.bulletCount - 1) * spreadAngle) / 2;

                for (let i = 0; i < player.bulletCount; i++) {
                    const angle = startAngle + i * spreadAngle;
                    bullets.push({
                        x: player.x,
                        y: player.y,
                        vx: Math.cos(angle) * 8,
                        vy: Math.sin(angle) * 8,
                        radius: 5,
                        color: '#00FFFF'
                    });
                }
            }
        }

        function showLevelUpMenu() {
            const allUpgrades = [
                { id: 'speed', text: '⚡ 增加移動速度 (+1)', action: () => player.speed += 1 },
                { id: 'rate', text: '🔥 提升發射速度 (-5幀冷卻)', action: () => player.shootRate = Math.max(8, player.shootRate - 5) },
                { id: 'multi', text: '🏹 多重射擊 (+1 子彈)', action: () => player.bulletCount += 1 },
                { id: 'magnet', text: '🧲 擴大拾取範圍 (+30 磁力)', action: () => player.magnetRadius += 30 }
            ];

            const shuffled = allUpgrades.sort(() => 0.5 - Math.random()).slice(0, 3);
            
            upgradeOptionsContainer.innerHTML = '';
            shuffled.forEach(upg => {
                const btn = document.createElement('button');
                btn.className = 'optionBtn';
                btn.innerText = upg.text;
                btn.onclick = () => {
                    upg.action();
                    levelUpMenu.style.display = 'none';
                    gameState = 'PLAYING';
                    gameLoop();
                };
                upgradeOptionsContainer.appendChild(btn);
            });

            levelUpMenu.style.display = 'block';
        }

        function addExp(amount) {
            player.exp += amount;
            sessionGold += 10;

            if (player.exp >= player.maxExp) {
                player.exp -= player.maxExp;
                player.level += 1;
                player.maxExp = Math.floor(player.maxExp * 1.5);
                
                if (player.level % 5 === 0) {
                    spawnBoss();
                }

                gameState = 'PAUSED';
                showLevelUpMenu();
            }
        }

        function triggerGameOver() {
            gameState = 'GAMEOVER';
            savedData.gold += sessionGold;

            finalScoreText.innerText = `你在大世界戰場存活到了等級 ${player.level}！`;
            earnedGoldText.innerText = sessionGold;
            gameOverMenu.style.display = 'block';
        }

        function returnToMainMenu() {
            gameOverMenu.style.display = 'none';
            mainMenu.style.display = 'block';
            gameState = 'MENU';
            updateUI();
            drawMenuBackground();
        }

        function drawMenuBackground() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#1b2631";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function gameLoop() {
            if (gameState !== 'PLAYING') return;

            // キーボードとスマホジョイスティックの両方に対応
            let moveX = 0;
            let moveY = 0;

            if (keys['w'] || keys['W'] || keys['ArrowUp']) moveY -= 1;
            if (keys['s'] || keys['S'] || keys['ArrowDown']) moveY += 1;
            if (keys['a'] || keys['A'] || keys['ArrowLeft']) moveX -= 1;
            if (keys['d'] || keys['D'] || keys['ArrowRight']) moveX += 1;

            if (joystick.active) {
                moveX = joystick.moveX;
                moveY = joystick.moveY;
            }

            player.x = Math.max(player.radius, Math.min(WORLD_WIDTH - player.radius, player.x + moveX * player.speed));
            player.y = Math.max(player.radius, Math.min(WORLD_HEIGHT - player.radius, player.y + moveY * player.speed));

            camera.x = player.x - canvas.width / 2;
            camera.y = player.y - canvas.height / 2;

            if (player.invincibleTimer > 0) player.invincibleTimer--;

            player.shootCooldown++;
            if (player.shootCooldown >= player.shootRate) {
                autoShoot();
                player.shootCooldown = 0;
            }

            enemySpawnTimer++;
            if (enemySpawnTimer >= 50) {
                spawnEnemy();
                enemySpawnTimer = 0;
            }

            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.x += b.vx;
                b.y += b.vy;
                if (Math.hypot(b.x - player.x, b.y - player.y) > 800) bullets.splice(i, 1);
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                const angle = Math.atan2(player.y - e.y, player.x - e.x);
                e.x += Math.cos(angle) * e.speed;
                e.y += Math.sin(angle) * e.speed;

                if (Math.hypot(player.x - e.x, player.y - e.y) < player.radius + e.radius && player.invincibleTimer === 0) {
                    player.hp -= e.damage;
                    player.invincibleTimer = 30;
                    if (player.hp <= 0) { player.hp = 0; triggerGameOver(); return; }
                }

                for (let j = bullets.length - 1; j >= 0; j--) {
                    const b = bullets[j];
                    if (Math.hypot(b.x - e.x, b.y - e.y) < b.radius + e.radius) {
                        e.hp -= 1;
                        bullets.splice(j, 1);
                        if (e.hp <= 0) {
                            if (e.isBoss) {
                                for (let k = 0; k < 10; k++) gems.push({ x: e.x + (Math.random() - 0.5) * 40, y: e.y + (Math.random() - 0.5) * 40, radius: 12 });
                            } else {
                                gems.push({ x: e.x, y: e.y, radius: 10 });
                            }
                            enemies.splice(i, 1);
                            break;
                        }
                    }
                }
            }

            for (let i = gems.length - 1; i >= 0; i--) {
                const g = gems[i];
                const dist = Math.hypot(player.x - g.x, player.y - g.y);
                if (dist < player.magnetRadius) {
                    const angle = Math.atan2(player.y - g.y, player.x - g.x);
                    g.x += Math.cos(angle) * 6;
                    g.y += Math.sin(angle) * 6;
                }
                if (dist < player.radius + g.radius) {
                    gems.splice(i, 1);
                    addExp(1);
                }
            }

            // 描画
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(-camera.x, -camera.y);

            // 背景グリッド
            ctx.strokeStyle = '#2c3e50';
            ctx.lineWidth = 1;
            const gridSize = 100;
            for (let x = 0; x <= WORLD_WIDTH; x += gridSize) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, WORLD_HEIGHT); ctx.stroke();
            }
            for (let y = 0; y <= WORLD_HEIGHT; y += gridSize) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(WORLD_WIDTH, y); ctx.stroke();
            }

            ctx.strokeStyle = '#FF0000';
            ctx.lineWidth = 5;
            ctx.strokeRect(0, 0, WORLD_WIDTH, WORLD_HEIGHT);

            // モンスターボール
            gems.forEach(g => {
                if (images.ball.complete && images.ball.naturalWidth !== 0) {
                    ctx.drawImage(images.ball, g.x - 12, g.y - 12, 24, 24);
                } else {
                    ctx.beginPath(); ctx.arc(g.x, g.y, g.radius, 0, Math.PI * 2); ctx.fillStyle = '#00FF66'; ctx.fill(); ctx.closePath();
                }
            });

            // 磁力サークル
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.magnetRadius, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0, 255, 255, 0.05)';
            ctx.fill();
            ctx.strokeStyle = 'rgba(0, 255, 255, 0.2)';
            ctx.stroke();
            ctx.closePath();

            // プレイヤー（イーブイ）
            if (player.invincibleTimer % 6 < 3) {
                if (images.player.complete && images.player.naturalWidth !== 0) {
                    ctx.drawImage(images.player, player.x - 30, player.y - 30, 60, 60);
                } else {
                    ctx.beginPath(); ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2); ctx.fillStyle = '#FFD700'; ctx.fill(); ctx.closePath();
                }
            }

            // 弾
            bullets.forEach(b => {
                ctx.beginPath(); ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2); ctx.fillStyle = b.color; ctx.fill(); ctx.closePath();
            });

            // 敵（ヒトカゲ / リザードン）
            enemies.forEach(e => {
                const img = e.isBoss ? images.boss : images.enemy;
                const imgSize = e.isBoss ? 110 : 50;

                if (img.complete && img.naturalWidth !== 0) {
                    ctx.drawImage(img, e.x - imgSize / 2, e.y - imgSize / 2, imgSize, imgSize);
                } else {
                    ctx.beginPath(); ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2); ctx.fillStyle = e.isBoss ? '#9932CC' : '#FF4444'; ctx.fill(); ctx.closePath();
                }

                const barWidth = e.isBoss ? 60 : 28;
                const barHeight = e.isBoss ? 6 : 4;
                const barOffsetY = e.radius + (e.isBoss ? 15 : 10);

                ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                ctx.fillRect(e.x - barWidth / 2, e.y - barOffsetY, barWidth, barHeight);
                ctx.fillStyle = e.isBoss ? '#00FF00' : '#32CD32';
                ctx.fillRect(e.x - barWidth / 2, e.y - barOffsetY, Math.max(0, (e.hp / e.maxHp) * barWidth), barHeight);
            });

            ctx.restore();

            // ジョイスティック描画
            if (joystick.active) {
                ctx.beginPath();
                ctx.arc(joystick.startX, joystick.startY, 50, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
                ctx.fill();
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(joystick.startX + joystick.moveX * 50, joystick.startY + joystick.moveY * 50, 20, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 215, 0, 0.6)';
                ctx.fill();
            }

            // UI
            ctx.fillStyle = "white";
            ctx.font = "14px sans-serif";
            ctx.fillText(`血量: ${player.hp} / ${player.maxHp}`, 15, 25);
            ctx.fillStyle = "#444";
            ctx.fillRect(15, 30, 180, 10);
            ctx.fillStyle = "#FF4444";
            ctx.fillRect(15, 30, Math.max(0, (player.hp / player.maxHp) * 180), 10);

            ctx.fillStyle = "white";
            ctx.fillText(`等級: ${player.level}`, 15, 60);
            ctx.fillStyle = "#444";
            ctx.fillRect(15, 65, 180, 10);
            ctx.fillStyle = "#00FF66";
            ctx.fillRect(15, 65, (player.exp / player.maxExp) * 180, 10);

            ctx.fillStyle = "#FFD700";
            ctx.font = "13px sans-serif";
            ctx.fillText(`💰 金幣: ${sessionGold}`, 15, 95);

            requestAnimationFrame(gameLoop);
        }

        drawMenuBackground();
        updateUI();
    </script>
</body>
</html>
