<script>
const $=i=>document.getElementById(i),cv=$('c'),ctx=cv.getContext('2d'),W=5000,R=Math.random,rn=n=>Math.floor(R()*n),KEY='DND_ROGUE_V12';
const cl=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
let G={gold:0,vol:50,sel:-1,unl:[],first:true,up:{},ach:{}};
try{const raw=localStorage.getItem(KEY);if(raw){try{Object.assign(G,JSON.parse(raw))}catch(e){localStorage.setItem(KEY+'_bak',raw)}}}catch(e){}
if(!Array.isArray(G.unl))G.unl=[];if(!G.up||typeof G.up!='object')G.up={};if(!G.ach||typeof G.ach!='object')G.ach={};G.gold=+G.gold||0;

const HERO=["..HHHH..",".HHHHHH.",".SSSSSS.",".SESSES.",".SSSSSS.","..BBBB..",".BBBBBB.","SBBBBBBS","..D..D..","..D..D.."],HATS=["#8e44ad","#c0392b","#222","#bdc3c7","#a0522d","#27ae60","#7f8c8d","#5dade2","#d4a359"];

const E0={goblin:{r:12,hp:6,sp:1.5,dm:2,col:'#2ed573'},archer:{r:11,hp:5,sp:1.1,dm:2,col:'#c8e06b'},beholder:{r:10,hp:4,sp:2.3,dm:3,col:'#ffa502'},slime:{r:14,hp:10,sp:.9,dm:3,col:'#1e90ff'},ogre:{r:20,hp:40,sp:.7,dm:7,col:'#a0522d'},bomber:{r:11,hp:5,sp:2,dm:0,col:'#e84393'}};

const UNLOCK=200;const SP={};
function build(){SP.h=H.map((h,i)=>mk(HERO,{H:HATS[i],S:'#f1c27d',B:h[2],E:'#111',D:'#2b1d14'}));

function spr(c,x,y,f){ctx.save();ctx.translate(Math.round(x),Math.round(y));if(f)ctx.scale(-1,1);ctx.drawImage(c,-c.width/2,-c.height/2);ctx.restore()}

/* 狀態 */
let P,B,SW,E,PT,IT,FT,CH,FX,HZ,RK,fr,T,kills,run,S='menu',god=false,nextBoss,bi,finalSp,ct,raf,back='menu',cam={x:0,y:0},keys={},jv={x:0,y:0},tip='',rst=0;

function hideScr(){ov.style.display='none';ui(1);fixScroll();setTimeout(fixScroll,50)}

/* 選單 */
function menu(){S='menu';cancelAnimationFrame(raf);scr(`<h1 style="color:#d4a359;margin:0 0 6px">D&D 像素肉鴿</h1><p style="color:#ffd700">💰 ${G.gold}</p>
<button class=b onclick="start()">⚔️ 開始遊玩</button><button class=b onclick="heroes()">👤 角色與職業</button><button class=b onclick="ups()">🛡️ 永久升級</button><button class=b onclick="achv()">${AL.some(a=>G.ach[a[0]]==1)?'🔴 ':''}🏆 成就</button><button class=b onclick="sets('menu')">⚙️ 設定</button>
